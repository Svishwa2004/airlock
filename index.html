<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Airlock — your data stays in the tab</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="head">
        <div>
          <h1>Airlock</h1>
          <p class="tagline">
            An AI agent can analyse this spreadsheet without ever receiving it.
            Parsing and every calculation happen in this tab.
          </p>
        </div>
        <div id="tool-badge" class="badge" aria-live="polite">checking…</div>
      </header>

      <section class="controls">
        <label class="file-input">
          <input id="file" type="file" accept=".csv,text/csv" />
          <span>Choose a CSV…</span>
        </label>
        <button id="load-sample" type="button">Reload sample expenses</button>
        <label class="currency-label">
          Currency
          <select id="currency">
            <option value="LKR" selected>LKR Rs.</option>
            <option value="USD">USD $</option>
            <option value="EUR">EUR €</option>
            <option value="GBP">GBP £</option>
            <option value="INR">INR ₹</option>
            <option value="JPY">JPY ¥</option>
            <option value="AUD">AUD $</option>
            <option value="CAD">CAD $</option>
            <option value="SGD">SGD $</option>
            <option value="AED">AED د.إ</option>
            <option value="plain">No symbol</option>
          </select>
        </label>
        <span id="status" class="status" role="status"></span>
      </section>

      <p id="highlight-note" class="note" aria-live="polite"></p>

      <section class="table-wrap" tabindex="0" aria-label="Loaded rows, scrollable">
        <table id="table">
          <thead>
            <tr>
              <th scope="col">Date</th>
              <th scope="col">Description</th>
              <th scope="col">Category</th>
              <th scope="col" class="num">Amount</th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr class="empty">
              <td colspan="4">No data loaded yet.</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
